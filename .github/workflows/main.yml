name: GoatBot-Pro

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '*/30 * * * *' # প্রতি ৩০ মিনিট পরপর অটো রিস্টার্ট হবে

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'

    - name: Install Dependencies & Start Bot
      run: |
        npm install
        node index.js
